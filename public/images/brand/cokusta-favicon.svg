<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="round">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="256" fill="#1b7d92"/>
    <rect y="256" width="512" height="256" fill="#00A650"/>
  </g>

  <!-- crossed tools: wrench -->
  <g transform="translate(256 270) rotate(-45)" fill="#ffffff">
    <!-- handle -->
    <rect x="-22" y="-10" width="200" height="44" rx="22"/>
    <!-- head ring -->
    <circle cx="-70" cy="12" r="70" fill="#ffffff"/>
    <circle cx="-70" cy="12" r="28" fill="#1b7d92"/>
    <!-- jaw cut -->
    <rect x="-140" y="-8" width="50" height="40" fill="#1b7d92"/>
  </g>

  <!-- screwdriver -->
  <g transform="translate(256 270) rotate(45)" fill="#ffffff">
    <rect x="-18" y="-20" width="36" height="210" rx="12"/>
    <!-- tip -->
    <path d="M-14 188 h28 l-10 46 h-8 z"/>
    <!-- handle top -->
    <rect x="-28" y="-70" width="56" height="70" rx="14"/>
    <rect x="-18" y="-58" width="36" height="12" rx="4" fill="#00A650"/>
  </g>
</svg>
